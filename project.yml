name: WageDrip
options:
  bundleIdPrefix: com.andyuneducated
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  WageDripCore:
    path: Packages/WageDripCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  WageDrip:
    type: application
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    supportedDestinations: [iOS, macOS]
    sources:
      - WageDrip
      - Shared
    dependencies:
      - package: WageDripCore
      - target: WageDripWidgets
      # The watch app travels inside the iPhone app; the Mac build has no use for it.
      - target: WageDripWatch
        platformFilter: iOS
    info:
      path: WageDrip/Info.plist
      properties:
        CFBundleDisplayName: 窝囊费
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.andyuneducated.wagedrip.refresh
        UIBackgroundModes:
          - fetch
          - processing
        LSApplicationCategoryType: public.app-category.finance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyuneducated.wagedrip
        PRODUCT_NAME: WageDrip
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: WageDrip/WageDrip.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WageDrip/WageDrip-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  WageDripWidgets:
    type: app-extension
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    supportedDestinations: [iOS, macOS]
    sources:
      - WageDripWidgets
      - Shared
      - WageDrip/Assets.xcassets
      - WageDrip/Localizable.xcstrings
    dependencies:
      - package: WageDripCore
    info:
      path: WageDripWidgets/Info.plist
      properties:
        CFBundleDisplayName: 窝囊费
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyuneducated.wagedrip.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: WageDripWidgets/WageDripWidgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WageDripWidgets/WageDripWidgets-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  WageDripWatch:
    type: application
    platform: watchOS
    sources:
      - WageDripWatch
      - Shared
      - WageDrip/Assets.xcassets
      - WageDrip/Localizable.xcstrings
      - WageDrip/InfoPlist.xcstrings
    dependencies:
      - package: WageDripCore
    info:
      path: WageDripWatch/Info.plist
      properties:
        CFBundleDisplayName: 窝囊费
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.andyuneducated.wagedrip
        # Tapping the Live Activity in the watch's Smart Stack opens this app.
        WKSupportsLiveActivityLaunchAttributeTypes:
          - WageActivityAttributes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyuneducated.wagedrip.watchkitapp
        PRODUCT_NAME: WageDripWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
schemes:
  WageDrip:
    build:
      targets:
        WageDrip: all
        WageDripWidgets: all
    run:
      config: Debug
